<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Трекер употребления нецензурной лексики</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:#111; color:#eee; padding:16px; min-height:100vh; display:flex; flex-direction:column; gap:16px; }
  h1 { font-size:17px; text-align:center; margin:4px 0; line-height:1.3; font-weight:600; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; text-align:center; }
  .stat { padding:14px; border-radius:14px; background:#1c1c1c; }
  .stat .num { font-size:34px; font-weight:700; }
  .stat .label { font-size:13px; opacity:.7; margin-top:4px; }
  .mat .num { color:#ff4d4d; }
  .rep .num { color:#4dff88; }
  .buttons { display:grid; grid-template-columns:1fr 1fr; gap:12px; flex:1; min-height:200px; }
  button { border:none; border-radius:20px; color:white; font-size:20px; font-weight:800; letter-spacing:1px; cursor:pointer; user-select:none; transition:transform .08s; }
  button:active { transform:scale(0.96); }
  .btn-mat { background:linear-gradient(160deg,#ff3b3b,#b30000); }
  .btn-rep { background:linear-gradient(160deg,#2ecc71,#0e8a45); }
  .calendar-title { text-align:center; font-size:15px; opacity:.7; }
  .calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .day { aspect-ratio:1; border-radius:10px; background:#1c1c1c; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; padding:2px; }
  .day .d { font-size:12px; opacity:.6; }
  .day .m { color:#ff5555; font-weight:700; }
  .day .r { color:#55ff88; font-weight:700; }
  .day.today { outline:2px solid #fff; }
  .footer { text-align:center; font-size:12px; opacity:.4; }
  .reset { background:#222; color:#888; padding:8px 14px; border-radius:8px; font-size:12px; }
</style>
</head>
<body>
<h1>Трекер употребления нецензурной лексики</h1>
<div class="stats">
  <div class="stat mat"><div class="num" id="todayMat">0</div><div class="label">БРАНЬ сегодня</div></div>
  <div class="stat rep"><div class="num" id="todayRep">0</div><div class="label">ЗАМЕНА сегодня</div></div>
</div>
<div class="buttons">
  <button class="btn-mat" id="btnMat">БРАНЬ</button>
  <button class="btn-rep" id="btnRep">ЗАМЕНА</button>
</div>
<div class="calendar-title">Последние 30 дней</div>
<div class="calendar" id="calendar"></div>
<div class="footer"><button class="reset" id="btnReset">Сбросить всё</button></div>
<script>
const KEY='matTrackerData';
let data=JSON.parse(localStorage.getItem(KEY)||'{}');
const todayKey=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function render(){
  const t=todayKey();
  data[t]=data[t]||{m:0,r:0};
  document.getElementById('todayMat').textContent=data[t].m;
  document.getElementById('todayRep').textContent=data[t].r;
  const cal=document.getElementById('calendar');cal.innerHTML='';
  for(let i=29;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const key=d.toISOString().slice(0,10);
    const div=document.createElement('div');
    div.className='day'+(key===t?' today':'');
    const rec=data[key]||{m:0,r:0};
    div.innerHTML=`<div class="d">${key.slice(8)}</div><div><span class="m">${rec.m||''}</span></div><div><span class="r">${rec.r?'+'+rec.r:''}</span></div>`;
    cal.appendChild(div);
  }
}
function add(type){const t=todayKey();data[t]=data[t]||{m:0,r:0};data[t][type]++;save();render();if(navigator.vibrate)navigator.vibrate(30);}
document.getElementById('btnMat').onclick=()=>add('m');
document.getElementById('btnRep').onclick=()=>add('r');
document.getElementById('btnReset').onclick=()=>{if(confirm('Удалить все данные?')){data={};save();render();}};
render();
</script>
</body>
</html>
